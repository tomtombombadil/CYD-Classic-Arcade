name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Board list comes from platformio.ini: every env with custom_firmware_name.
  boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import configparser, json
          c = configparser.ConfigParser(interpolation=None, strict=False)
          c.read("platformio.ini", encoding="utf-8")
          inc = [{"env": s[4:], "name": c[s]["custom_firmware_name"]}
                 for s in c.sections()
                 if s.startswith("env:") and c[s].get("custom_firmware_name")]
          print("matrix=" + json.dumps({"include": inc}))
          EOF
      - id: ver
        run: |
          V="v$(tr -d ' \r\n' < VERSION)"
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must look like 1.2.3"; exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

  build:
    needs: [boards]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.boards.outputs.matrix) }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            external
          key: pio-6.1.18-${{ hashFiles('platformio.ini', 'tools/fetch_deps.py') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PlatformIO 6.2.0 brings SCons 4.11, which breaks pioarduino's ESP-IDF
      # build ("No module named SCons.Tool.FortranCommon")
      - name: Install PlatformIO and esptool
        run: python -m pip install platformio==6.1.18 esptool==4.8.1

      - name: Build
        env:
          CYD_VERSION: ${{ needs.boards.outputs.version }}
        # -k: report every file that fails, not just the first
        run: pio run -k -e ${{ matrix.env }}

      - name: Size
        run: |
          B=.pio/build/${{ matrix.env }}
          ls -l $B/*.bin
          xtensa-esp32-elf-size $B/firmware.elf 2>/dev/null || find ~/.platformio/packages -name 'xtensa-esp32-elf-size' -exec {} $B/firmware.elf \; -quit

      # One file per board, flashed at 0x0: bootloader + partition table + app
      - name: Merge firmware
        run: |
          B=.pio/build/${{ matrix.env }}
          mkdir -p out
          esptool.py --chip esp32 merge_bin -o "out/${{ matrix.name }}.bin" \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0x10000 $B/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          path: out/*.bin

      # Symbols for decoding a crash backtrace
      - name: Keep symbols
        run: |
          mkdir -p sym
          cp .pio/build/${{ matrix.env }}/firmware.elf "sym/${{ matrix.name }}.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: elf-${{ matrix.env }}
          path: sym/*.elf
          retention-days: 90
